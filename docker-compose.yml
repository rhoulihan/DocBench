services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0.4
    container_name: docbench-mongodb
    ports:
      - "27017:27017"
    networks:
      - docbench-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  oracle:
    image: gvenzl/oracle-free:23.6-slim-faststart
    container_name: docbench-oracle
    ports:
      - "1521:1521"
      - "27018:27018"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=docbench
      - APP_USER_PASSWORD=docbench
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - docbench-network

volumes:
  oracle-data:

networks:
  docbench-network:
    driver: bridge
